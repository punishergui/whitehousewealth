version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: whwos-postgres
    environment:
      POSTGRES_USER: whwos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whwos_dev_password}
      POSTGRES_DB: whwos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whwos"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"

  redis:
    image: redis:7-alpine
    container_name: whwos-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whwos-api
    environment:
      DATABASE_URL: postgresql+asyncpg://whwos:${POSTGRES_PASSWORD:-whwos_dev_password}@postgres:5432/whwos
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-32chars}
      FIREFLY_BASE_URL: ${FIREFLY_BASE_URL:-http://firefly:8080}
      FIREFLY_PAT: ${FIREFLY_PAT:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - default
      - hermes_bridge
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - default
      - hermes_bridge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.whwos.local`)"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whwos-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://whwos:${POSTGRES_PASSWORD:-whwos_dev_password}@postgres:5432/whwos
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production-32chars}
      FIREFLY_BASE_URL: ${FIREFLY_BASE_URL:-http://firefly:8080}
      FIREFLY_PAT: ${FIREFLY_PAT:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    networks:
      - default
      - hermes_bridge
    labels:
      - "traefik.enable=false"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whwos-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`whwos.local`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
  hermes_bridge:
    external: true
    name: hermes_whw_bridge
